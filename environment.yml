# Feature 4 demo environment.
# Reproduces the Pinocchio + hpp-fcl + EAIK stack used by
# scripts/feature4_demo.py on Windows / Linux / macOS in one command:
#
#     conda env create -f environment.yml
#     conda activate apcc
#
# Note: pinocchio and hpp-fcl come from conda-forge as prebuilt binaries
# (no C++ build toolchain required on Windows).
name: apcc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pinocchio
  - hpp-fcl
  - numpy
  - scipy
  - pandas
  - matplotlib
  - pyyaml
  - tqdm
  - lxml
  - networkx
  - pip
  - pip:
      - urchin
      - eaik
